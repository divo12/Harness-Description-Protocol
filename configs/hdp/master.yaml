# HDP engine master config — the ONLY file a human edits to launch the engine end to end.
# Reuses the repo's existing _base overlay mechanism: it inherits configs/base.yaml and adds
# only an `hdp:` block (engine flags) and a `run:` block (run scope + smoke settings).
# Existing experiments under configs/experiments/ keep working unchanged.
_base: ../base.yaml

# Engine flags. `enabled` is the treatment-arm switch (engine-local in Phase 0; Phase 5 adds
# the same flag to configs/base.yaml so the live AHE loop can A/B on it).
hdp:
  enabled: true
  document: hdp/examples/code-agent-simple.hdp   # source-of-truth HDP doc (gen input)
  harness: agents/code_agent_simple              # backend harness (lift input)
  target: nexau                                  # backend generator/lifter
  guard:                                         # which edit-governance engine the loop uses
    engine: reconcile                            # reconcile (per-delta rollback) | atomic (all-or-nothing tiered)
    mode: enforce                                # enforce | review  (atomic engine only)
    # interaction: enforce                       # enforce (revert denied edits) | monitor (log verdict, keep the edit)
    # warn_and_retry: false                      # on a denial, re-invoke the proposer once with a warning (default OFF)
    # warn_and_retry_max_attempts: 1             # retry cap when warn_and_retry is on
  # track:
  #   commit: false                              # per-iteration git commit of the document (free git log/diff history)

# Run scope: identifies the run, the arm, and the smoke slice.
run:
  run_id: null            # null -> auto: hdp-<arm>-<UTC timestamp>
  arm: treatment          # control | treatment (for single-arm sub-commands)
  seed: 0
  smoke:
    enabled: false        # forced on by `--smoke` or the `smoke` sub-command
    max_tasks: 5          # 1-10; tiny slice for end-to-end wiring checks
    max_iterations: 1
    k: 1                  # rollouts per task
    dry_run: false        # stub the harbor eval with `fake_reward` (no LLM/GPU spend)
    fake_reward: 1.0      # pass@1 used for every arm when dry_run is on
