# HDP parity run — treatment (reconcile) across 3 varied tasks, 1 iteration (baseline parity).
# Validates that the generated agent now matches control's (reasoning:high via code_agent_patch).
_base: ../experiments/exp-simple-code-gpt54.yaml
_name: hdp-ab-multi-reconcile
_description: "HDP treatment (reconcile) — 3 tasks x1 iter, agent-parity vs control."

hdp:
  enabled: true
  document: hdp/examples/code-agent-simple.hdp
  harness: agents/code_agent_simple
  target: nexau
  guard:
    engine: reconcile

path: ./dataset/tb2-flat
task_names: [fix-git, overfull-hbox, git-multibranch]
harbor:
  k: 1
  n_concurrent: 3          # the 3 tasks run concurrently

run:
  arm: treatment
  seed: 0
  smoke:
    enabled: true
    max_iterations: 1
    dry_run: false
    fake_reward: 0.0

evolve_agent:
  llm_config:
    reasoning:
      effort: "low"
    timeout: 600

agent_debugger:
  enabled: true
  max_concurrent: 3
  max_tasks: 3
  timeout_per_task: 240
  retry_attempts: 3
explore_agent:
  enabled: false
notify:
  enabled: false
