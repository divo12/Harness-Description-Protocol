# 5-task observation (2 easy/pass, 1 medium/fail, 1 hard/pass, 1 hard/fail on baseline) at k=2.
# Treatment (reconcile). Baseline labels from docs/baseline-gpt52.md.
_base: ../experiments/exp-simple-code-gpt54.yaml
_name: hdp-ab-multi5-reconcile
_description: "HDP treatment (reconcile) — 5 mixed-difficulty tasks, k=2."

hdp:
  enabled: true
  document: hdp/examples/code-agent-simple.hdp
  harness: agents/code_agent_simple
  target: nexau
  guard:
    engine: reconcile

path: ./dataset/tb2-flat
task_names: [fix-git, cobol-modernization, gcode-to-text, cancel-async-tasks, write-compressor]
harbor:
  k: 2
  n_concurrent: 5        # 5 tasks x 2 rollouts run concurrently

run:
  arm: treatment
  seed: 0
  smoke:
    enabled: true
    max_iterations: 1
    dry_run: false
    fake_reward: 0.0

evolve_agent:
  llm_config:
    reasoning:
      effort: "low"
    timeout: 600

agent_debugger:
  enabled: true
  max_concurrent: 2
  max_tasks: 5
  timeout_per_task: 240
  retry_attempts: 3
explore_agent:
  enabled: false
notify:
  enabled: false
