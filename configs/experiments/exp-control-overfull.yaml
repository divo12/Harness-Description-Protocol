# Control arm — the existing AHE loop (evolve.py) editing NexAU files directly, on the SAME
# task/iters as the HDP treatment arms. This is the A/B baseline (hdp.enabled=false equivalent).
_base: ./exp-simple-code-gpt54.yaml
_name: control-overfull
_description: "Control (AHE on NexAU files) — overfull-hbox x3 iters, real eval + ADB."

path: ./dataset/tb2-flat
task_names: [overfull-hbox]
max_iterations: 3
target_pass_rate: 1.01        # never early-terminate — run all 3 iterations

harbor:
  k: 1
  n_concurrent: 1

# match the treatment arms' reasoning/timeout for a fair comparison
evolve_agent:
  llm_config:
    reasoning:
      effort: "low"
    timeout: 600

agent_debugger:
  enabled: true
  max_concurrent: 1
  max_tasks: 2
  timeout_per_task: 240
  retry_attempts: 3
explore_agent:
  enabled: false
notify:
  enabled: false
feishu_webhook: "https://placeholder.invalid"
