# Control arm (AHE on NexAU files) — same 3 tasks x1 iter as the HDP treatment parity run.
_base: ./exp-simple-code-gpt54.yaml
_name: control-multi
_description: "Control (AHE) — 3 tasks x1 iter, agent-parity baseline."

path: ./dataset/tb2-flat
task_names: [fix-git, overfull-hbox, git-multibranch]
max_iterations: 1
target_pass_rate: 1.01

harbor:
  k: 1
  n_concurrent: 3

evolve_agent:
  llm_config:
    reasoning:
      effort: "low"
    timeout: 600

agent_debugger:
  enabled: true
  max_concurrent: 3
  max_tasks: 3
  timeout_per_task: 240
  retry_attempts: 3
explore_agent:
  enabled: false
notify:
  enabled: false
feishu_webhook: "https://placeholder.invalid"
