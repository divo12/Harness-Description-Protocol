_base: "../base.yaml"
_name: "gpt54"
_description: "GPT-5.4，走new api"
_tags: ["model-comparison", "gpt54"]

feishu_webhook: "https://placeholder.invalid"

source_config_dir: "agents/code_agent_simple"
agent_config_filename: "code_agent.yaml"

harbor:
  k: 2
  n_concurrent: 96

llm:
    api_key: "${GPT54_LLM_API_KEY}"
    base_url: "${GPT54_LLM_BASE_URL}"
    model: "gpt-5.2"

code_agent_patch:
  tool_call_mode: openai
  llm_config:
    api_type: openai_responses
    reasoning:
      effort: "high"
      summary: "detailed"

evolve_agent:
  tool_call_mode: openai
  llm_config:
    api_key: "${GPT54_LLM_API_KEY}"
    base_url: "${GPT54_LLM_BASE_URL}"
    model: "gpt-5.2"
    api_type: openai_responses
    reasoning:
      effort: "xhigh"
      summary: "detailed"

explore_agent_patch:
  tool_call_mode: openai
  llm_config:
    api_type: openai_responses
    reasoning:
      effort: "xhigh"
      summary: "detailed"